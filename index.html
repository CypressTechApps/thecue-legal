<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cue — Legal &amp; Support</title>
<style>
  :root{
    --bg:#001227; --surface:#04182E; --border:#0b3350;
    --text:#F7F7F7; --muted:#9DA1A5; --accent:#E86AA6;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  main{flex:1;max-width:640px;margin:0 auto;padding:70px 24px;text-align:center}
  .brand{font-size:34px;font-weight:800;letter-spacing:.5px}
  .tag{color:var(--muted);margin-top:4px}
  p.lead{margin:26px auto 34px;max-width:520px;color:#E7ECF1}
  .links{display:flex;flex-direction:column;gap:12px;max-width:360px;margin:0 auto}
  .links a{display:block;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:15px 18px;color:var(--text);font-weight:600}
  .links a:hover{border-color:var(--accent);text-decoration:none}
  footer{border-top:1px solid var(--border);text-align:center;color:var(--muted);
    font-size:13px;padding:22px 20px 40px}
</style>
</head>
<body>
<main>
  <div class="brand">THE CUE</div>
  <div class="tag">Guided intimacy for two.</div>
  <p class="lead">A private, end-to-end-encrypted intimacy app for consenting adults. Nothing
  leaves your phone unless you choose it to. Below are our policies and how to reach us.</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Use</a>
    <a href="support.html">Support</a>
  </div>
</main>
<footer>© 2026 Cypress Technology LLC · "Simply Made."</footer>
</body>
</html>
